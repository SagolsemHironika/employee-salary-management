<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Salary Management</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter: a UI face drawn for screens with a tall x-height and, critically,
      genuine tabular figures — the reason salary columns line up. 400/500/600
      only; a payroll tool never needs a light or a black weight.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      (function () {
        try {
          var t = localStorage.getItem('ledger.theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {
          /* private mode — fall back to the OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
