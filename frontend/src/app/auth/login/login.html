<!--
  Sign-in is the one screen that sets expectations for everything behind it, so
  it stays deliberately plain: a single bordered card, no hero art, no gradient.
  For a tool holding payroll data, restraint reads as competence.
-->
<div class="login">
  <div class="login__card panel">
    <div class="login__brand">
      <span class="login__mark" aria-hidden="true">SM</span>
      <span class="login__wordmark">Salary Management</span>
    </div>

    <h1 class="login__title">Sign in</h1>
    <p class="login__sub">Use your HR administrator account.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline" class="login__field">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="username"
          autofocus
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="login__field">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      <!-- role="alert" so a failed attempt is announced, not just repainted. -->
      @if (errorMessage()) {
        <p class="form-error login__error" role="alert">{{ errorMessage() }}</p>
      }

      <button
        mat-flat-button
        type="submit"
        class="login__submit"
        [disabled]="form.invalid || submitting()"
      >
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>

  <p class="login__footnote">Access is logged. Salary records are append-only and auditable.</p>
</div>
